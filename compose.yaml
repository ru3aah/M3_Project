#version: '3.8'

services:
  backend:
    build: .
    env_file:
      - ./.env
    command: poetry run python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped
    # Optional: mount source for live reload during dev
    volumes:
      - .:/app

  db:
    image: postgres:17-alpine
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Optional: expose DB to host tools (psql/pgAdmin)
    ports:
      - "5432:5432"

volumes:
  postgres_data: